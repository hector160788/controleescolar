<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/ui :: appHead('Control Escolar | Alta de asignatura')}"></head>

<body>
    <div class="home-wrapper">
        <div th:replace="~{fragments/ui :: appTopbar('Alta de asignatura')}"></div>

        <section class="home-content-layout">
            <div th:replace="~{fragments/menu :: leftMenu}"></div>

            <article class="home-panel">
                <h2 class="h4 mb-2">ALTA DE ASIGNATURAS</h2>

                <div class="alert alert-success" role="alert" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
                <div class="alert alert-danger" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></div>

                <form id="formAltaAsignatura" class="row g-3" method="post" th:action="@{/asignatura/crear}"
                    th:object="${asignaturaalta}">
                    <input type="hidden" id="confirmado" name="confirmado" value="false">
                    <div class="col-md-12">
                        <label class="form-label" for="nombreinstitucion">INSTITUCION</label>
                        <select id="nombreinstitucion" name="nombreinstitucion" th:field="*{idinstitucion}"
                            class="form-select" required>
                            <option value="0">Selecciona...</option>
                            <option th:each="institucion : ${lstinstituciones}" th:value="${institucion.idinstitucion}"
                                th:text="${institucion.descripcion}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="idcarrera">CARRERA</label>
                        <textarea id="idcarrera" name="idcarrera" th:field="*{idcarrera}" class="form-control"
                            placeholder="Carrera" rows="3" required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="idasignaturasep">ID ASIGNATURA</label>
                        <textarea id="idasignaturasep" name="idasignaturasep" th:field="*{idasignaturasep}"
                            class="form-control" placeholder="ID de la asignatura SEP" rows="3" required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="claveasignatura">CLAVE ASIGNATURA</label>
                        <textarea id="claveasignatura" name="claveasignatura" th:field="*{claveasignatura}"
                            class="form-control" placeholder="Clave de la asignatura" rows="3" required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="descripcion">DESCRIPCION</label>
                        <textarea id="descripcion" name="descripcion" th:field="*{descripcion}" class="form-control"
                            placeholder="Descripción de la asignatura" rows="3" required></textarea>
                    </div>
                    <div class="col-12 d-flex gap-2 justify-content-end mt-2">
                        <button type="button" class="btn btn-outline-secondary">Cancelar</button>
                        <button type="submit" class="btn-app-primary btn-app-inline">Guardar</button>
                    </div>
                </form>
                <div class="modal fade" id="confirmarCarrerasModal" tabindex="-1"
                    aria-labelledby="confirmarCarrerasLabel" aria-hidden="true">
                    <div class="modal-dialog modal-lg modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="confirmarCarrerasLabel">Confirmar guardado de asignaturas</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Cerrar"></button>
                            </div>
                            <div class="modal-body">
                                <p>Se guardaran las siguientes asignaturas:</p>
                                <pre id="resumenCarreras"></pre>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary"
                                    data-bs-dismiss="modal">Cancelar</button>
                                <button type="button" id="btnConfirmarGuardar"
                                    class="btn-app-primary btn-app-inline">Confirmar y guardar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </article>
        </section>
    </div>

    <th:block th:replace="~{fragments/ui :: appScripts}"></th:block>
    <script>
        (function () {
            const form = document.getElementById('formAltaAsignatura');
            if (!form) {
                return;
            }

            const inputConfirmado = document.getElementById('confirmado');
            const resumenEl = document.getElementById('resumenCarreras');
            const btnConfirmar = document.getElementById('btnConfirmarGuardar');
            const modalEl = document.getElementById('confirmarCarrerasModal');
            const modal = new bootstrap.Modal(modalEl);

            function splitLineas(id) {
                return document.getElementById(id).value
                    .split(/\r?\n/)
                    .map(v => v.trim())
                    .filter(v => v.length > 0);
            }

            form.addEventListener('submit', function (e) {
                if (inputConfirmado.value === 'true') {
                    return;
                }

                e.preventDefault();

                const carreras = splitLineas('idcarrera');
                const asignaturas = splitLineas('idasignaturasep');
                const claves = splitLineas('claveasignatura');
                const descripciones = splitLineas('descripcion');

                const valido = carreras.length > 0
                    && carreras.length === asignaturas.length
                    && asignaturas.length === claves.length
                    && claves.length === descripciones.length;

                if (!valido) {
                    alert('Las listas deben tener el mismo numero de lineas y no estar vacias.');
                    return;
                }

                const resumen = carreras.map((carrera, i) =>
                    (i + 1) + ') CARRERA: ' + carrera
                    + ' | ID ASIGNATURA SEP: ' + asignaturas[i]
                    + ' | CLAVE: ' + claves[i]
                    + ' | DESCRIPCION: ' + descripciones[i]
                ).join('\n');

                resumenEl.textContent = resumen;
                modal.show();
            });

            btnConfirmar.addEventListener('click', function () {
                inputConfirmado.value = 'true';
                modal.hide();
                form.submit();
            });
        })();
    </script>

</body>

</html>
