<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/ui :: appHead('Control Escolar | Alta de RVOE vs Asignatura')}"></head>

<body>
    <div class="home-wrapper">
        <div th:replace="~{fragments/ui :: appTopbar('Alta de RVOE vs Asignatura Paso 5')}"></div>

        <section class="home-content-layout">
            <div th:replace="~{fragments/menu :: leftMenu}"></div>

            <article class="home-panel">
                <h2 class="h4 mb-2">ALTA DE RVOE vs ASIGNATURA</h2>

                <div class="alert alert-success" role="alert" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
                <div class="alert alert-danger" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></div>

                <form id="formAltaRvoeAsignatura" class="row g-3" method="post" th:action="@{/rvoeasignatura/crear}"
                    th:object="${rvoeasignaturaalta}">
                    <input type="hidden" id="confirmado" name="confirmado" value="false">
                    <div class="col-md-12">
                        <label class="form-label" for="nombreinstitucion">INSTITUCION</label>
                        <select id="nombreinstitucion" name="nombreinstitucion" th:field="*{idinstitucion}"
                            class="form-select" required>
                            <option value="0">Selecciona...</option>
                            <option th:each="institucion : ${lstinstituciones}" th:value="${institucion.idinstitucion}"
                                th:text="${institucion.descripcion}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="idasignaturasep">ID ASIGNATURA SEP</label>
                        <textarea id="idasignaturasep" name="idasignaturasep" th:field="*{idasignaturasep}"
                            class="form-control" placeholder="ID de la asignatura SEP" rows="3" required></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="carreras">ID CARRERAS</label>
                        <textarea id="carreras" name="carreras" th:field="*{carreras}" class="form-control"
                            placeholder="ID de las carreras" rows="3" required></textarea>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label" for="rvoe">RVOE</label>
                        <textarea id="rvoe" name="rvoe" th:field="*{rvoe}" class="form-control" placeholder="RVOE"
                            rows="3" required></textarea>
                    </div>

                    <div class="col-12 d-flex gap-2 justify-content-end mt-2">
                        <button type="button" class="btn btn-outline-secondary">Cancelar</button>
                        <button type="submit" class="btn-app-primary btn-app-inline">Guardar</button>
                    </div>
                </form>
                <div class="modal fade" id="confirmarRvoeAsignaturaModal" tabindex="-1"
                    aria-labelledby="confirmarRvoeAsignaturaLabel" aria-hidden="true">
                    <div class="modal-dialog modal-lg modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="confirmarRvoeAsignaturaLabel">Confirmar guardado de RVOE
                                    asignatura</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Cerrar"></button>
                            </div>
                            <div class="modal-body">
                                <p>Se guardaran los siguientes registros de RVOE asignatura:</p>
                                <pre id="resumenRvoeAsignatura"></pre>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary"
                                    data-bs-dismiss="modal">Cancelar</button>
                                <button type="button" id="btnConfirmarGuardar"
                                    class="btn-app-primary btn-app-inline">Confirmar y guardar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </article>
        </section>
    </div>

    <th:block th:replace="~{fragments/ui :: appScripts}"></th:block>
    <script>
        (function () {
            const form = document.getElementById('formAltaRvoeAsignatura');
            if (!form) {
                return;
            }

            const inputConfirmado = document.getElementById('confirmado');
            const resumenEl = document.getElementById('resumenRvoeAsignatura');
            const btnConfirmar = document.getElementById('btnConfirmarGuardar');
            const modalEl = document.getElementById('confirmarRvoeAsignaturaModal');
            const modal = new bootstrap.Modal(modalEl);

            function splitLineas(id) {
                return document.getElementById(id).value
                    .split(/\r?\n/)
                    .map(v => v.trim())
                    .filter(v => v.length > 0);
            }

            form.addEventListener('submit', function (e) {
                if (inputConfirmado.value === 'true') {
                    return;
                }

                e.preventDefault();

                const institucion = document.getElementById('nombreinstitucion').value.trim();
                const asignaturas = splitLineas('idasignaturasep');
                const rvoes = splitLineas('rvoe');
                const carreras = splitLineas('carreras');

                const valido = institucion !== '0'
                    && asignaturas.length > 0
                    && asignaturas.length === rvoes.length
                    && asignaturas.length === carreras.length;

                if (!valido) {
                    alert('Las listas deben tener el mismo numero de lineas y no estar vacias.');
                    return;
                }

                const resumen = asignaturas.map((asignatura, i) =>
                    (i + 1) + ') INSTITUCION: ' + institucion
                    + ' | ID ASIGNATURA SEP: ' + asignatura
                    + ' | RVOE: ' + rvoes[i]
                    + ' | ID CARRERAS: ' + carreras[i]
                ).join('\n');

                resumenEl.textContent = resumen;
                modal.show();
            });

            btnConfirmar.addEventListener('click', function () {
                inputConfirmado.value = 'true';
                modal.hide();
                form.submit();
            });
        })();
    </script>

</body>

</html>
