<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: appHead('Control Escolar | Acceso')}"></head>
<body>
<main class="app-shell">
	<section class="app-card">
		<div class="row g-0">
			<aside class="col-lg-5 brand-panel d-flex flex-column justify-content-center">
				<div class="logo-slot" aria-label="Espacio para el logo de la escuela">
					<img th:src="@{/img/gutt.png}" alt="Logo de la escuela"
						 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
					<span class="logo-fallback" style="display:none;">Logo escuela</span>
				</div>
				<h1 class="brand-title">Sistema Integral de Control Escolar</h1>
				<p class="brand-subtitle">Acceso institucional para personal autorizado.</p>
			</aside>

			<div class="col-lg-7 form-panel d-flex flex-column justify-content-center">
				<h2 class="form-title">Bienvenido</h2>
				<p class="form-copy">Ingresa tus credenciales para continuar.</p>

				<div th:if="${param.error}" class="alert-app alert-app-danger" role="alert">
					Usuario o contraseña incorrectos. Verifica tus datos.
				</div>
				<div th:if="${param.logout}" class="alert-app alert-app-success" role="alert">
					Tu sesión se cerró correctamente.
				</div>

				<form th:action="@{/login}" method="post" class="mt-2">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

					<div class="mb-3">
						<label for="username" class="form-label form-label">Usuario</label>
						<input id="username" name="username" type="text" class="form-control" maxlength="150" required autofocus>
					</div>

					<div class="mb-4">
						<label for="password" class="form-label form-label">Contraseña</label>
						<input id="password" name="password" type="password" class="form-control" maxlength="255" required>
					</div>

					<button type="submit" class="btn-app-primary">Entrar al sistema</button>
				</form>
			</div>
		</div>
	</section>
</main>

<th:block th:replace="~{fragments/ui :: appScripts}"></th:block>
</body>
</html>
