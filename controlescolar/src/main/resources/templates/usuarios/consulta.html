<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: appHead('Control Escolar | Consulta de usuario')}"></head>
<body>
<div class="home-wrapper">
    <div th:replace="~{fragments/ui :: appTopbar('Consulta de usuario')}"></div>

    <section class="home-content-layout">
        <div th:replace="~{fragments/menu :: leftMenu}"></div>

        <article class="home-panel">
            <h2 class="h4 mb-2">Consulta de usuario</h2>

            <div class="alert alert-success" role="alert" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
            <div class="alert alert-danger" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></div>

            <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/usuarios/consulta}">
                <div class="col-md-5">
                    <label class="form-label" for="correoBusqueda">Buscar por correo electronico</label>
                    <input id="correoBusqueda" name="correo" type="email" class="form-control"
                           th:value="${filtroCorreo}" placeholder="correo@dominio.com">
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="nombreBusqueda">Buscar por nombre</label>
                    <input id="nombreBusqueda" name="nombre" type="text" class="form-control"
                           th:value="${filtroNombre}" placeholder="Nombre o apellidos">
                </div>
                <div class="col-md-2 d-flex flex-column gap-2">
                    <input type="hidden" name="size" th:value="${pageSize != null ? pageSize : 10}">
                    <button type="submit" class="btn btn-primary w-100">Buscar</button>
                    
                    <a class="btn btn-outline-secondary w-100" th:href="@{/usuarios/consulta}">Limpiar</a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID Usuario</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Telefono</th>
                        <th>Estatus</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(usuariosResultado)}">
                        <td colspan="7" class="text-center text-muted">Sin resultados para la busqueda.</td>
                    </tr>
                    <tr th:each="usuario : ${usuariosResultado}">
                        <td th:text="${usuario.idUsuario}">1</td>
                        <td th:text="${usuario.nombreCompleto}">Nombre Ejemplo</td>
                        <td th:text="${usuario.correo}">correo@dominio.com</td>
                        <td th:text="${usuario.rol}">ROLE_USER</td>
                        <td th:text="${usuario.telefono1}">5550000000</td>
                        <td>
                            <span class="badge" th:classappend="${usuario.activo == 1} ? ' text-bg-success' : ' text-bg-secondary'"
                                  th:text="${usuario.activo == 1} ? 'Activo' : 'Inactivo'">Activo</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{${usuario.editarUrl}}">Editar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${totalPages != null and totalPages > 1}" aria-label="Paginacion usuarios">
                <ul class="pagination justify-content-end">
                    <li class="page-item" th:classappend="${currentPage == 0} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/usuarios/consulta(correo=${filtroCorreo},nombre=${filtroNombre},page=${currentPage - 1},size=${pageSize})}">Anterior</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? ' active'">
                        <a class="page-link"
                           th:href="@{/usuarios/consulta(correo=${filtroCorreo},nombre=${filtroNombre},page=${i},size=${pageSize})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/usuarios/consulta(correo=${filtroCorreo},nombre=${filtroNombre},page=${currentPage + 1},size=${pageSize})}">Siguiente</a>
                    </li>
                </ul>
            </nav>
        </article>
    </section>
</div>

<th:block th:replace="~{fragments/ui :: appScripts}"></th:block>
</body>
</html>
